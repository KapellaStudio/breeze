# ─────────────────────────────────────────────────────────────────────────────
# Breeze — Netlify configuration
# Static release site plus native Netlify Functions from the canonical repo.
# ─────────────────────────────────────────────────────────────────────────────
[build]
  publish = "site"
  command = "python3 build.py"

[functions]
  directory = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"

# Security headers. A download page that ships executable binaries needs a
# deliberately narrow browser surface.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/preview/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self'"

# API/download routes are declared by each function's exported Netlify config.
# The final rewrite is only for ordinary static-site navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
