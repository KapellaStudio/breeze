<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05070a">
<title>Breeze — the browser after the click</title>
<meta name="description" content="Breeze by Kapella is a privacy-first Chromium browser built around context, recovery, local tools and calm power.">
<style>
:root{
  color-scheme:dark;
  --bg:#05070a;--bg2:#0a0d13;--ink:#f7fbff;--muted:#a8b4c3;--faint:#738095;
  --line:rgba(255,255,255,.11);--glass:rgba(13,18,26,.64);
  --mint:#79f2d0;--cyan:#31d8f2;--blue:#4c7dff;--violet:#8f6cff;
  --shadow:0 44px 120px rgba(0,0,0,.48);
  --radius:30px;--max:1240px;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;color:var(--ink);background:
radial-gradient(1100px 750px at 75% -8%,rgba(76,125,255,.18),transparent 66%),
radial-gradient(920px 620px at 12% 8%,rgba(49,216,242,.10),transparent 62%),
var(--bg);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.42;
background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
background-size:64px 64px;mask-image:linear-gradient(to bottom,#000 0,transparent 78%)}
a{color:inherit}button,input{font:inherit}
.wrap{width:min(var(--max),calc(100% - 44px));margin:auto}
.nav{height:82px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:720;letter-spacing:-.035em;font-size:21px}
.brandMark{width:35px;height:35px;display:grid;place-items:center}
.brandMark svg{width:100%;height:100%}
.navlinks{display:flex;gap:7px;align-items:center}
.navlinks a{text-decoration:none;color:#c8d1dc;font-size:14px;padding:10px 13px;border-radius:999px;transition:.22s ease}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.06)}
.navcta{border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.07)!important;color:#fff!important}
.hero{min-height:calc(100svh - 82px);display:grid;align-items:center;padding:52px 0 90px;position:relative}
.heroGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,.9fr);gap:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:9px;color:#b9c6d6;font-size:12px;letter-spacing:.15em;text-transform:uppercase}
.eyebrow:before{content:"";width:24px;height:1px;background:linear-gradient(90deg,var(--mint),var(--cyan))}
h1{font-size:clamp(64px,8.4vw,126px);line-height:.88;letter-spacing:-.075em;margin:22px 0 28px;max-width:880px;font-weight:720}
.gradientText{background:linear-gradient(96deg,#fff 2%,#c7fff0 35%,#67def9 61%,#8fa9ff 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{font-size:clamp(18px,2vw,23px);line-height:1.55;color:#b4bfcc;max-width:720px;margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:13px 18px;color:#e8eef5;background:rgba(255,255,255,.045);backdrop-filter:blur(14px);transition:transform .22s ease,border-color .22s ease,background .22s ease}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
.btn.primary{background:linear-gradient(110deg,#e9fff8,#d6f7ff 55%,#dce5ff);color:#071017;border-color:transparent;box-shadow:0 16px 42px rgba(49,216,242,.16)}
.micro{margin-top:18px;color:#718092;font-size:12px}
.orbit{position:relative;aspect-ratio:1;display:grid;place-items:center;isolation:isolate}
.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.orbit:before{inset:8%;background:radial-gradient(circle at 42% 38%,rgba(121,242,208,.24),rgba(49,216,242,.10) 35%,rgba(76,125,255,.12) 60%,transparent 72%);box-shadow:inset 0 0 90px rgba(83,194,255,.06);animation:breathe 7s ease-in-out infinite}
.orbit:after{inset:19%;border:1px solid rgba(133,221,255,.16);box-shadow:0 0 90px rgba(49,216,242,.08);animation:spin 24s linear infinite}
.logoHero{width:52%;filter:drop-shadow(0 30px 70px rgba(24,174,222,.28));animation:float 6s ease-in-out infinite;z-index:2}
.logoHero svg{width:100%;height:auto}
.ring{position:absolute;inset:4%;border-radius:50%;border:1px solid rgba(255,255,255,.06);transform:rotate(16deg)}
.ring.r2{inset:14%;transform:rotate(-22deg);border-color:rgba(93,222,255,.08)}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#b8ffe7;box-shadow:0 0 22px #46dff8}
.spark.s1{top:17%;left:21%;animation:drift 5s ease-in-out infinite}
.spark.s2{right:13%;top:38%;animation:drift 6s 1s ease-in-out infinite}
.spark.s3{left:23%;bottom:18%;animation:drift 7s .3s ease-in-out infinite}
.section{padding:110px 0}
.sectionHead{display:flex;justify-content:space-between;gap:40px;align-items:end;margin-bottom:44px}
.kicker{color:#8da1b7;text-transform:uppercase;letter-spacing:.14em;font-size:12px}
.section h2{font-size:clamp(42px,5.4vw,78px);line-height:.98;letter-spacing:-.058em;margin:11px 0 0;max-width:800px}
.sectionHead p{max-width:420px;color:#92a0b0;line-height:1.6;margin:0}
.stageWrap{position:relative;padding:1px;border-radius:36px;background:linear-gradient(140deg,rgba(122,247,214,.46),rgba(74,166,255,.2) 32%,rgba(255,255,255,.08) 62%,rgba(143,108,255,.28));box-shadow:var(--shadow)}
.stage{border-radius:35px;overflow:hidden;background:rgba(7,10,15,.94);border:1px solid rgba(255,255,255,.05);min-height:680px;display:grid;grid-template-columns:220px 1fr}
.side{padding:18px 13px;border-right:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(255,255,255,.035),transparent);display:flex;flex-direction:column}
.sideTop{display:flex;gap:7px;padding:4px 6px 20px}
.dot{width:8px;height:8px;border-radius:50%;background:#42505f}.dot:nth-child(1){background:#ff6b6b}.dot:nth-child(2){background:#ffd35c}.dot:nth-child(3){background:#63e19a}
.ws{font-size:11px;color:#6f7e8e;text-transform:uppercase;letter-spacing:.13em;padding:0 9px 8px}
.tab{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;color:#a9b6c5;font-size:13px;margin:2px 0}
.tab.active{background:rgba(255,255,255,.075);color:white}
.fav{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(121,242,208,.22),rgba(76,125,255,.24));font-size:10px;color:#bffcf0}
.sideBottom{margin-top:auto;padding:12px 8px;color:#657486;font-size:11px}
.chrome{min-width:0;display:flex;flex-direction:column}
.toolbar{height:62px;border-bottom:1px solid rgba(255,255,255,.075);display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(255,255,255,.018)}
.navIcon{color:#68798a;font-size:14px}
.omniDemo{height:38px;flex:1;max-width:720px;border:1px solid rgba(255,255,255,.10);border-radius:13px;background:rgba(255,255,255,.045);display:flex;align-items:center;gap:10px;padding:0 13px;color:#8796a8}
.omniDemo input{flex:1;background:none;border:0;outline:0;color:#edf7ff;font-size:13px;min-width:0}
.shield{margin-left:auto;color:#80ead3;font-size:12px}
.page{flex:1;position:relative;overflow:hidden;padding:64px 66px;background:
radial-gradient(650px 420px at 20% 10%,rgba(49,216,242,.10),transparent 64%),
radial-gradient(500px 420px at 82% 78%,rgba(76,125,255,.12),transparent 68%),#090d13}
.
