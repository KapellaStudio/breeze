# ═══════════════════════════════════════════════════════════════════════════
# BREEZE — SIGNED PRODUCTION PACKAGING
# ═══════════════════════════════════════════════════════════════════════════
appId: com.kapella.breeze
productName: Breeze
copyright: © 2026 Kapella
executableName: breeze

directories:
  output: dist
  buildResources: build

icon: build/icon.png

files:
  - bootstrap.js
  - launch.js
  - preferences.js
  - workspaces.js
  - workspace-data.js
  - vault.js
  - weather.js
  - omnibox.js
  - split.js
  - main.js
  - preload.js
  - security.js
  - search.js
  - media.js
  - extensions.js
  - extensions-runtime.js
  - extension-compat.js
  - extension-page-preload.js
  - extension-sw-preload.js
  - extension-identity-preload.js
  - extension-self-close.js
  - downloads.js
  - state.js
  - permissions.js
  - library.js
  - display.js
  - documents.js
  - pdf-preload.js
  - ui/pdf-viewer.html
  - ui/pdf-viewer.css
  - ui/pdf-viewer.js
  - package.json
  - ui/breeze-desktop.html
  - ui/breeze-mobile.html

asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**

mac:
  category: public.app-category.productivity
  artifactName: Breeze-1.0-${arch}.${ext}
  forceCodeSigning: true
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  artifactName: Breeze-1.0-${arch}.${ext}
  background: build/dmg-background.png
  iconSize: 118
  contents:
    - x: 170
      y: 226
    - x: 490
      y: 226
      type: link
      path: /Applications

win:
  forceCodeSigning: true
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Breeze-Setup-1.0.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerSidebar: build/installer-sidebar.bmp
  uninstallerSidebar: build/installer-sidebar.bmp
  installerHeader: build/installer-header.bmp
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Breeze
  runAfterFinish: true
  displayLanguageSelector: false

linux:
  category: Network
  synopsis: A privacy-first Chromium browser
  maintainer: Kapella <hello@kapella.studio>
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: Breeze-1.0-${arch}.${ext}
deb:
  artifactName: breeze_1.0_${arch}.${ext}
