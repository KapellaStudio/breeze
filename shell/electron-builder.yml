# ═══════════════════════════════════════════════════════════════════════════
# BREEZE — PACKAGING
#
# Produces installers for macOS, Windows and Linux. Nothing here signs
# anything: see "SIGNING" at the bottom.
#
# Run from shell/ AFTER the root build.py, because ui/breeze-desktop.html is
# generated and gitignored. `npm run dist` does both in the right order.
# ═══════════════════════════════════════════════════════════════════════════

appId: com.kapella.breeze
productName: Breeze
copyright: © 2026 Kapella

executableName: breeze

directories:
  output: dist
  buildResources: build

# Allowlist, not a denylist. A denylist silently ships whatever gets added to
# the directory later; the test harnesses and their fake sites have no business
# inside a shipped browser.
files:
  - bootstrap.js
  - launch.js
  - preferences.js
  - workspaces.js
  - main.js
  - preload.js
  - security.js
  - search.js
  - media.js
  - extensions.js
  - downloads.js
  - state.js
  - permissions.js
  - library.js
  - display.js
  - documents.js
  - pdf-preload.js
  - ui/pdf-viewer.html
  - ui/pdf-viewer.css
  - ui/pdf-viewer.js
  - package.json
  - ui/breeze-desktop.html
  - ui/breeze-mobile.html

asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  hardenedRuntime: false

dmg:
  artifactName: Breeze-${version}-${arch}.${ext}

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Breeze-Setup-${version}.${ext}

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  category: Network
  synopsis: A privacy-first Chromium browser
  maintainer: Kapella <hello@kapella.studio>
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

appImage:
  artifactName: Breeze-${version}-${arch}.${ext}

deb:
  artifactName: breeze_${version}_${arch}.${ext}

# ── SIGNING ──────────────────────────────────────────────────────────────────
# Linux ships without a platform signing gate. Windows/macOS RC artifacts are
# intentionally unsigned/unnotarized and remain test builds until the separate
# production signing workflow has real credentials.
