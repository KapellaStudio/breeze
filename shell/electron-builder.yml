# ═══════════════════════════════════════════════════════════════════════════
# BREEZE — PACKAGING
# ═══════════════════════════════════════════════════════════════════════════
appId: com.kapella.breeze
productName: Breeze
copyright: © 2026 Kapella
executableName: breeze

directories:
  output: dist
  buildResources: build

files:
  - bootstrap.js
  - launch.js
  - preferences.js
  - workspaces.js
  - workspace-data.js
  - vault.js
  - weather.js
  - main.js
  - preload.js
  - security.js
  - search.js
  - media.js
  - extensions.js
  - downloads.js
  - state.js
  - permissions.js
  - library.js
  - display.js
  - documents.js
  - pdf-preload.js
  - ui/pdf-viewer.html
  - ui/pdf-viewer.css
  - ui/pdf-viewer.js
  - package.json
  - ui/breeze-desktop.html
  - ui/breeze-mobile.html

asar: true
asarUnpack:
  - node_modules/ffmpeg-static/**

mac:
  category: public.app-category.productivity
  extendInfo:
    NSLocationWhenInUseUsageDescription: Breeze uses your approximate location only when you enable local weather on the New Tab page. Coordinates are not stored.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  hardenedRuntime: false
dmg:
  artifactName: Breeze-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Breeze-Setup-${version}.${ext}

linux:
  category: Network
  synopsis: A privacy-first Chromium browser
  maintainer: Kapella <hello@kapella.studio>
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
appImage:
  artifactName: Breeze-${version}-${arch}.${ext}
deb:
  artifactName: breeze_${version}_${arch}.${ext}

# Windows/macOS outputs in this lane are intentionally unsigned test/RC builds.
# The separate production config hard-fails unless real signing is available.
