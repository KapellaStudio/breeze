name: extension-compat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mv3-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install shell dependencies
        run: npm install --no-audit --no-fund
      - name: Probe Electron MV3 service-worker runtime
        run: xvfb-run -a npx electron extensiontest.js --no-sandbox
      - name: Probe wallet-class extension surface
        run: xvfb-run -a npx electron walletcompat.js --no-sandbox
      - name: Probe managed extension compatibility layer
        run: xvfb-run -a npx electron extensioncompattest.js --no-sandbox
      - name: Probe production extension runtime adapter
        run: xvfb-run -a npx electron extensionruntimetest.js --no-sandbox
      - name: Probe privileged extension popup self-close
        run: xvfb-run -a npx electron extensionclosetest.js --no-sandbox
      - name: Keep existing browser-core contracts green
        run: npm run browsercoretest
