name: extension-compat

on:
  push:
    branches:
      - 'feature/extension-*'
  pull_request:
    paths:
      - 'shell/extensions.js'
      - 'shell/extension-compat.js'
      - 'shell/extensiontest.js'
      - 'shell/metamaskcompat.js'
      - 'shell/extensionbridgetest.js'
      - 'shell/extensioncompattest.js'
      - 'shell/package.json'
      - '.github/workflows/extension-compat.yml'

permissions:
  contents: read

jobs:
  mv3-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install shell dependencies
        run: npm install --no-audit --no-fund
      - name: Probe Electron MV3 service-worker runtime
        run: xvfb-run -a npx electron extensiontest.js --no-sandbox
      - name: Probe MetaMask-class extension surface
        run: xvfb-run -a npx electron metamaskcompat.js --no-sandbox
      - name: Probe authenticated compatibility bridge
        run: xvfb-run -a npx electron extensionbridgetest.js --no-sandbox
      - name: Probe managed extension compatibility layer
        if: ${{ hashFiles('shell/extensioncompattest.js') != '' }}
        run: xvfb-run -a npx electron extensioncompattest.js --no-sandbox
      - name: Keep existing browser-core contracts green
        run: npm run browsercoretest
