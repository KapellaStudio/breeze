name: split-view-refactor
on:
  push:
    branches: [next/split-view]
    paths:
      - 'tools/apply_split_view.py'
      - '.github/workflows/split-view-refactor.yml'

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/split-view
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Apply Split View integration
        run: python3 tools/apply_split_view.py
      - name: Syntax check transformed files
        run: |
          node --check shell/main.js
          node --check shell/preload.js
          node --check shell/integration.js
          node --check shell/browsercoretest.js
          node --check src/breeze-split-ui.js
          node --check shell/split.js
          node --check shell/splittest.js
          python3 -m py_compile build.py
      - name: Finalize one product commit
        run: |
          rm -f tools/apply_split_view.py .github/workflows/split-view-refactor.yml
          git config user.name 'Kapella Venture Studio'
          git config user.email 'goldenmonkeyindex@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m '[skip netlify] Wire native two-pane Split View end to end'
          git push origin HEAD:next/split-view
