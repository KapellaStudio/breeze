name: ux-certification

on:
  push:
    branches: [ux/full-product-pass-2026-08-26]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build canonical UI
        run: python3 build.py
      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund
      - name: Verify packaged dependency graph
        working-directory: shell
        run: npm run packagecontracttest
      - name: Native mouse and keyboard daily-driver journey
        working-directory: shell
        run: npm run uxjourney

  package:
    needs: journey
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac
          - os: ubuntu-latest
            name: linux
            args: --linux
    runs-on: ${{ matrix.os }}
    name: native-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Build canonical UI
        run: python3 build.py
      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund
      - name: Verify packaged dependency graph
        working-directory: shell
        run: npm run packagecontracttest
      - name: Package unsigned beta candidate
        working-directory: shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged app.asar contents
        working-directory: shell
        run: npm run packagetest
      - name: Install and exercise Windows candidate
        if: ${{ matrix.name == 'windows' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem shell/dist/Breeze-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced' }
          $installDir = Join-Path $env:RUNNER_TEMP 'BreezeUXInstall'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS install failed with code $($install.ExitCode)" }
          $exe = Join-Path $installDir 'breeze.exe'
          if (-not (Test-Path $exe)) { throw 'Installed Breeze executable missing' }
          $smoke = Start-Process -FilePath $exe -ArgumentList @('--smoke-test') -PassThru
          try { Wait-Process -Id $smoke.Id -Timeout 90 -ErrorAction Stop } catch { Stop-Process -Id $smoke.Id -Force -ErrorAction SilentlyContinue; throw 'Installed Windows smoke timed out' }
          $smoke.Refresh(); if ($smoke.ExitCode -ne 0) { throw "Installed Windows smoke failed: $($smoke.ExitCode)" }
          $browser = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 12
          $browser.Refresh(); if ($browser.HasExited) { throw "Installed Windows Breeze exited early: $($browser.ExitCode)" }
          Stop-Process -Id $browser.Id -Force
      - name: Install and exercise macOS candidate
        if: ${{ matrix.name == 'macos' }}
        run: |
          machine="$(uname -m)"; suffix='arm64'; [ "$machine" = 'x86_64' ] && suffix='x64' || true
          dmg="$(find shell/dist -maxdepth 1 -name "Breeze-1.0-${suffix}.dmg" | head -1)"
          test -n "$dmg"
          mount="$RUNNER_TEMP/breeze-ux-dmg"; installed="$RUNNER_TEMP/Breeze.app"
          rm -rf "$mount" "$installed"; mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          cp -R "$mount/Breeze.app" "$installed"
          hdiutil detach "$mount"
          exe="$installed/Contents/MacOS/breeze"; test -x "$exe"
          "$exe" --smoke-test
          "$exe" >"$RUNNER_TEMP/breeze-mac.log" 2>&1 & pid=$!
          sleep 12
          kill -0 "$pid" 2>/dev/null || { cat "$RUNNER_TEMP/breeze-mac.log"; exit 1; }
          kill "$pid" || true; wait "$pid" || true
      - name: Install and exercise Linux candidates
        if: ${{ matrix.name == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ./shell/dist/breeze_1.0_amd64.deb
          xvfb-run -a breeze --smoke-test --no-sandbox
          set +e; timeout 12s xvfb-run -a breeze --no-sandbox; code=$?; set -e
          test "$code" -eq 124 || { echo "Installed DEB exited early: $code" >&2; exit 1; }
          appimage="$(find shell/dist -maxdepth 1 -name 'Breeze-1.0-*.AppImage' | head -1)"; test -n "$appimage"; chmod +x "$appimage"
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --smoke-test --no-sandbox
          set +e; timeout 12s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --no-sandbox; code=$?; set -e
          test "$code" -eq 124 || { echo "AppImage exited early: $code" >&2; exit 1; }
      - name: Checksums
        working-directory: shell/dist
        run: shasum -a 256 *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null || true
      - name: Upload candidate installers
        uses: actions/upload-artifact@v4
        with:
          name: breeze-ux-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          path: |
            shell/dist/*.dmg
            shell/dist/*.zip
            shell/dist/*.exe
            shell/dist/*.AppImage
            shell/dist/*.deb
