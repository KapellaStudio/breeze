name: production-probe-now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-probe-now.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Breeze production
        env:
          BASE: https://kapella-breeze.netlify.app
        run: |
          set -euo pipefail
          health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/health")"
          release_code="$(curl -sS -o /tmp/releases.json -w '%{http_code}' "$BASE/api/releases?channel=beta")"
          site_code="$(curl -sS -o /tmp/site.html -w '%{http_code}' "$BASE/")"
          curl -sS -D /tmp/download-headers.txt -o /dev/null "$BASE/download?channel=beta&platform=linux-x64"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,"",$0); sub(/^location:[[:space:]]*/,"",$0); print $0}' /tmp/download-headers.txt | tail -1)"
          sha="$(awk 'BEGIN{IGNORECASE=1} /^x-breeze-sha256:/{sub(/\r$/,"",$0); sub(/^x-breeze-sha256:[[:space:]]*/,"",$0); print $0}' /tmp/download-headers.txt | tail -1)"
          python3 - <<'PY'
          import json, pathlib, sys
          health=json.loads(pathlib.Path('/tmp/health.json').read_text())
          data=json.loads(pathlib.Path('/tmp/releases.json').read_text())
          site=pathlib.Path('/tmp/site.html').read_text()
          platforms={b.get('platform') for b in data.get('builds',[])}
          required={'macos-arm','macos-x64','windows-x64','linux-x64'}
          ok=(health.get('ok') is True and health.get('service')=='breeze'
              and data.get('version')=='1.3.0' and data.get('codename')=='McCloskey'
              and required.issubset(platforms)
              and 'Breeze 1.3.0 RC' in site)
          if not ok:
              print({'health':health,'release':data,'platforms':sorted(platforms)})
              sys.exit(1)
          PY
          grep -Eq '^HTTP/[^ ]+ 30[1278]' /tmp/download-headers.txt
          grep -qi '^location: https://github.com/KapellaStudio/breeze/releases/download/v1.3.0-rc.1/' /tmp/download-headers.txt
          grep -qi '^x-breeze-sha256: 830995f9733923e7a09e5c8cdb7cb7ce1e53b17086fe3ef66cba013836735e1a' /tmp/download-headers.txt
          echo "HEALTH_CODE=$health_code" >> "$GITHUB_ENV"
          echo "RELEASE_CODE=$release_code" >> "$GITHUB_ENV"
          echo "SITE_CODE=$site_code" >> "$GITHUB_ENV"
          echo "LOCATION=$location" >> "$GITHUB_ENV"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Report live probe
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Breeze live probe: **${{ job.status }}** — site=${SITE_CODE:-unknown}, health=${HEALTH_CODE:-unknown}, releases=${RELEASE_CODE:-unknown}; linux redirect=${LOCATION:-unknown}; sha=${SHA:-unknown}; run \`${{ github.run_id }}\`, main \`$GITHUB_SHA\`."
