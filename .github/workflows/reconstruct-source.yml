name: reconstruct-source

on:
  push:
    branches: [release/breeze-19-source]
    paths: ['.sourceparts/READY']

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/breeze-19-source
          fetch-depth: 1
      - name: Reconstruct oversized Breeze source files
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r target prefix count; do
            [ -n "$target" ] || continue
            mkdir -p "$(dirname "$target")"
            : > "$target"
            for i in $(seq -w 0 $((count-1))); do
              part=".sourceparts/${prefix}.${i}.part"
              test -f "$part"
              cat "$part" >> "$target"
            done
          done < .sourceparts/manifest
          rm -rf .sourceparts
          git config user.name "Kapella Venture Studio"
          git config user.email "goldenmonkeyindex@gmail.com"
          git add -A
          git commit -m "Reconstruct Breeze 19 source files"
          git push origin HEAD:release/breeze-19-source
