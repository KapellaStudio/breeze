name: production-smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke-manual
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Netlify production surface
        env:
          BASE: https://kapella-breeze.netlify.app
          EXPECTED_BETA_TAG: v1.0.0-beta.1
        run: |
          set -euo pipefail
          health_code="$(curl --silent --show-error --max-time 15 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health")"
          release_code="$(curl --silent --show-error --max-time 15 -o /tmp/releases.json -w '%{http_code}' "$BASE/api/releases?channel=beta")"
          site_code="$(curl --silent --show-error --max-time 15 -o /tmp/site.html -w '%{http_code}' "$BASE/")"
          test "$health_code" = 200
          test "$release_code" = 200
          test "$site_code" = 200
          python3 - <<'PY'
          import json, pathlib, sys
          health=json.loads(pathlib.Path('/tmp/health.json').read_text())
          data=json.loads(pathlib.Path('/tmp/releases.json').read_text())
          builds={b.get('platform'): b for b in data.get('builds',[])}
          required={'macos-arm','macos-x64','windows-x64','linux-x64'}
          site=pathlib.Path('/tmp/site.html').read_text()
          good=(health.get('ok') is True and health.get('service')=='breeze'
                and data.get('version')=='1.0' and data.get('codename')=='McCloskey'
                and required.issubset(set(builds))
                and 'Breeze 1.0' in site
                and '/download?channel=beta&platform=' in site)
          if not good:
              sys.exit(1)
          pathlib.Path('/tmp/expected-linux-sha.txt').write_text(builds['linux-x64']['sha256'].lower())
          PY
          curl --silent --show-error --max-time 15 -D /tmp/download-headers.txt -o /dev/null \
            "$BASE/download?channel=beta&platform=linux-x64"
          grep -Eq '^HTTP/[^ ]+ 30[1278]' /tmp/download-headers.txt
          grep -qi "^location: https://github.com/KapellaStudio/breeze/releases/download/${EXPECTED_BETA_TAG}/" /tmp/download-headers.txt
          expected_linux_sha256="$(cat /tmp/expected-linux-sha.txt)"
          grep -qi "^x-breeze-sha256: ${expected_linux_sha256}" /tmp/download-headers.txt

      - name: Report production smoke result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Breeze manual production smoke: **${{ job.status }}** — run \`${{ github.run_id }}\`."
