name: production-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'netlify/**'
      - 'supabase/**'
      - 'netlify.toml'
      - 'RELEASE_STATUS.md'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Netlify production surface
        env:
          BASE: https://kapella-breeze.netlify.app
          EXPECTED_BETA_TAG: v1.3.0-rc.3
          EXPECTED_LINUX_SHA256: ae800631d215354b91151f72408f31c1de95761fcf389c30644f87b2d12a4420
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            health_code="$(curl --silent --show-error --max-time 15 -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)"
            release_code="$(curl --silent --show-error --max-time 15 -o /tmp/releases.json -w '%{http_code}' "$BASE/api/releases?channel=beta" || true)"
            site_code="$(curl --silent --show-error --max-time 15 -o /tmp/site.html -w '%{http_code}' "$BASE/" || true)"
            echo "attempt=$attempt health=$health_code releases=$release_code site=$site_code"
            if [ "$health_code" = 200 ] && [ "$release_code" = 200 ] && [ "$site_code" = 200 ]; then
              if python3 - <<'PY'
          import json, pathlib, sys
          health=json.loads(pathlib.Path('/tmp/health.json').read_text())
          data=json.loads(pathlib.Path('/tmp/releases.json').read_text())
          platforms={b.get('platform') for b in data.get('builds',[])}
          required={'macos-arm','macos-x64','windows-x64','linux-x64'}
          site=pathlib.Path('/tmp/site.html').read_text()
          good=(health.get('ok') is True and health.get('service')=='breeze'
                and data.get('version')=='1.3.0' and data.get('codename')=='McCloskey'
                and required.issubset(platforms)
                and 'Breeze 1.3.0 RC' in site
                and '/api/releases?channel=beta' in site
                and '/download?channel=beta&platform=' in site)
          if not good:
              print({'health':health,'version':data.get('version'),'codename':data.get('codename'),'platforms':sorted(platforms)})
              sys.exit(1)
          print('Live Netlify Functions, beta API and RC site verified:', sorted(platforms))
          PY
              then ok=1; break; fi
            fi
            sleep 5
          done
          test "$ok" = 1

          curl --silent --show-error --max-time 15 -D /tmp/download-headers.txt -o /dev/null \
            "$BASE/download?channel=beta&platform=linux-x64"
          cat /tmp/download-headers.txt
          grep -Eq '^HTTP/[^ ]+ 30[1278]' /tmp/download-headers.txt
          grep -qi "^location: https://github.com/KapellaStudio/breeze/releases/download/${EXPECTED_BETA_TAG}/" /tmp/download-headers.txt
          grep -qi "^x-breeze-sha256: ${EXPECTED_LINUX_SHA256}" /tmp/download-headers.txt

      - name: Report production smoke result
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Breeze production smoke: **${{ job.status }}** — Netlify Functions/RC site/API/download redirect, run \`${{ github.run_id }}\`, main \`$GITHUB_SHA\`."
