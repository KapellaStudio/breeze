name: netlify-deploy-probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/netlify-deploy-probe.yml']

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production alias and last Netlify deploy URL
        env:
          PROD: https://kapella-breeze.netlify.app
          DEPLOY: https://6a8b311eceda1c92c49bab21--kapella-breeze.netlify.app
        run: |
          set -euo pipefail
          prod="$(curl -sS -o /tmp/prod -w '%{http_code}' "$PROD/" || true)"
          dep="$(curl -sS -o /tmp/deploy -w '%{http_code}' "$DEPLOY/" || true)"
          echo "production=$prod deploy=$dep"
          echo "PROD_CODE=$prod" >> "$GITHUB_ENV"
          echo "DEPLOY_CODE=$dep" >> "$GITHUB_ENV"
          if [ "$dep" = 200 ]; then
            grep -q 'Breeze' /tmp/deploy
          fi

      - name: Report probe
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Netlify deploy probe — production alias: **${PROD_CODE:-unknown}**; deploy-specific URL: **${DEPLOY_CODE:-unknown}** — run \`${{ github.run_id }}\`."
