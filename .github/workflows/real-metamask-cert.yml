name: real-metamask-cert

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shell/realmetamasktest.js'
      - 'shell/extensions-runtime.js'
      - 'shell/extension-compat.js'
      - 'shell/extension-page-preload.js'
      - '.github/workflows/real-metamask-cert.yml'

permissions:
  contents: read

jobs:
  official-metamask:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Breeze
        uses: actions/checkout@v4

      - name: Checkout pinned official MetaMask source
        uses: actions/checkout@v4
        with:
          repository: MetaMask/metamask-extension
          ref: 010e0528ff1a9883c83e2575eac07e18b38bd2d9
          path: .vendor/metamask
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Obtain pinned official MetaMask Chromium test build
        working-directory: .vendor/metamask
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(node -p "require('./package.json').version")"
          test "$SOURCE_VERSION" = "13.46.0"
          URL="https://diuv6g5fj9pvx.cloudfront.net/metamask-extension/26802049055/build-test-webpack/builds/metamask-chrome-13.46.0.zip"
          rm -rf /tmp/metamask-unpack dist/chrome
          mkdir -p /tmp/metamask-unpack dist
          curl --fail --location --retry 5 --retry-delay 2 --retry-all-errors "$URL" -o /tmp/metamask-chrome.zip
          unzip -q /tmp/metamask-chrome.zip -d /tmp/metamask-unpack
          MANIFEST="$(find /tmp/metamask-unpack -maxdepth 5 -type f -name manifest.json -print -quit)"
          test -n "$MANIFEST"
          cp -a "$(dirname "$MANIFEST")" dist/chrome
          test -f dist/chrome/manifest.json
          node -e "const p=require('./package.json'),m=require('./dist/chrome/manifest.json'); if(m.version!==p.version) throw new Error('source/build version mismatch: '+p.version+' vs '+m.version); console.log('MetaMask official build',m.version,'MV'+m.manifest_version,m.action&&m.action.default_popup)"

      - name: Install Breeze shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: Run official MetaMask inside Breeze
        working-directory: shell
        env:
          METAMASK_EXTENSION_DIR: ${{ github.workspace }}/.vendor/metamask/dist/chrome
        run: xvfb-run -a npx electron realmetamasktest.js --no-sandbox
