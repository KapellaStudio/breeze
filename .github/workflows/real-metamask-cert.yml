name: real-metamask-cert

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'shell/realmetamasktest.js'
      - 'shell/patch-metamask-harness.js'
      - 'shell/patch-metamask-sequential-sign.js'
      - 'shell/extensions-runtime.js'
      - 'shell/extension-compat.js'
      - 'shell/extension-page-preload.js'
      - 'shell/extension-sw-preload.js'
      - '.github/workflows/real-metamask-cert.yml'

permissions:
  contents: read

jobs:
  official-metamask:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Breeze
        uses: actions/checkout@v4

      - name: Checkout pinned official MetaMask source
        uses: actions/checkout@v4
        with:
          repository: MetaMask/metamask-extension
          ref: 010e0528ff1a9883c83e2575eac07e18b38bd2d9
          path: .vendor/metamask
          fetch-depth: 1

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Install and build pinned MetaMask Chromium test extension
        working-directory: .vendor/metamask
        env:
          CI: '1'
        run: |
          set -euo pipefail
          corepack enable
          cp .metamaskrc.dist .metamaskrc
          yarn install --immutable
          yarn webpack:tsc
          yarn build:test
          test -f dist/chrome/manifest.json
          node -e "const p=require('./package.json'),m=require('./dist/chrome/manifest.json'); const ok=m.version===p.version||m.version.startsWith(p.version+'.'); if(!ok) throw new Error('source/build version mismatch: '+p.version+' vs '+m.version); console.log('MetaMask source build',m.version,'MV'+m.manifest_version,m.action&&m.action.default_popup)"

      - name: Install Breeze shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: Run official MetaMask inside Breeze
        working-directory: shell
        env:
          METAMASK_EXTENSION_DIR: ${{ github.workspace }}/.vendor/metamask/dist/chrome
        run: |
          node patch-metamask-harness.js
          node patch-metamask-sequential-sign.js
          xvfb-run -a npx electron realmetamasktest.js --no-sandbox
