name: package

on:
  workflow_dispatch:
    inputs:
      publish_rc:
        description: 'Publish/update v1.0.0-beta.1 after the matrix passes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: package-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the UI
        run: python3 build.py
      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund
      - name: Verify package source contract
        working-directory: shell
        run: npm run packagecontracttest
      - name: Package unsigned test build
        working-directory: shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged app.asar contents
        working-directory: shell
        run: npm run packagetest
      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: breeze-${{ matrix.name }}
          retention-days: 14
          path: |
            shell/dist/*.dmg
            shell/dist/*.zip
            shell/dist/*.exe
            shell/dist/*.AppImage
            shell/dist/*.deb

  publish-rc:
    if: ${{ inputs.publish_rc == true }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: breeze-*
          path: release-assets
          merge-multiple: true
      - name: Build release manifests
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.')
          files=[]
          for p in sorted(root.iterdir()):
              if not p.is_file() or p.name in {'SHA256SUMS.txt','release-manifest.json'}:
                  continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              files.append({'name':p.name,'size':p.stat().st_size,'sha256':h})
          pathlib.Path('release-manifest.json').write_text(json.dumps({'version':'1.0','tag':'v1.0.0-beta.1','channel':'beta','source_sha':'${{ github.sha }}','files':files},indent=2)+'\n')
          PY
      - name: Publish Breeze 1.0 Beta 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v1.0.0-beta.1'
          notes='Breeze 1.0 Beta 1 manual certified beta build.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Breeze 1.0 Beta 1' --notes "$notes" --prerelease
          fi
