# ═══════════════════════════════════════════════════════════════════════════
# BREEZE — INSTALLER BUILD + RELEASE CANDIDATE PUBLICATION
#
# Builds macOS, Windows and Linux installers on GitHub's runners. The canonical
# release merge to main packages once automatically; future v* tags can package
# versioned releases, and workflow_dispatch remains available for maintainers.
#
# Windows/macOS outputs are currently unsigned, so the automatic main-merge
# publication is explicitly a prerelease. Stable public launch stays gated on
# platform signing/notarisation rather than hiding those OS trust warnings.
# ═══════════════════════════════════════════════════════════════════════════

name: package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build the UI
        run: python3 build.py

      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: Package
        working-directory: shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: breeze-${{ matrix.name }}
          retention-days: 30
          path: |
            shell/dist/*.dmg
            shell/dist/*.zip
            shell/dist/*.exe
            shell/dist/*.AppImage
            shell/dist/*.deb

      - name: Checksums
        working-directory: shell/dist
        run: |
          shasum -a 256 *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null || true

  publish-rc:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: breeze-*
          path: release-assets
          merge-multiple: true

      - name: Build release checksum manifest
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Breeze 1.3.0 RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v1.3.0-rc.1'
          notes='Breeze 1.3.0 release candidate. Linux, Windows and macOS desktop packages built directly from the canonical KapellaStudio/breeze main branch. Windows and macOS packages are not yet production code-signed/notarised; verify SHA256SUMS.txt before testing.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title 'Breeze 1.3.0 RC 1' --notes "$notes" --prerelease
          fi
