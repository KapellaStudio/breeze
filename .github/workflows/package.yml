# ═══════════════════════════════════════════════════════════════════════════
# BREEZE — INSTALLER BUILD
#
# Builds macOS, Windows and Linux installers on GitHub's runners. The canonical
# release merge to main packages once automatically; future v* tags package
# versioned releases, and workflow_dispatch remains available for maintainers.
#
# Nothing here is signed yet. DEPLOY.md documents the signing/notarisation gate.
# ═══════════════════════════════════════════════════════════════════════════

name: package

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Build the UI
        run: python3 build.py

      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: Package
        working-directory: shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: breeze-${{ matrix.name }}
          retention-days: 14
          path: |
            shell/dist/*.dmg
            shell/dist/*.zip
            shell/dist/*.exe
            shell/dist/*.AppImage
            shell/dist/*.deb

      - name: Checksums
        working-directory: shell/dist
        run: |
          shasum -a 256 *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null || true
