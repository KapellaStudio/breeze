# ═══════════════════════════════════════════════════════════════════════════
# BREEZE — UNSIGNED PACKAGE TEST + RELEASE-CANDIDATE PUBLICATION
#
# Main-branch source changes exercise the unsigned package matrix. Publishing
# RC bytes is explicit: workflow_dispatch(publish_rc=true), an RC tag push, or
# the one-shot [publish-rc2] marker used by the RC2 promotion commit.
# Stable tags are handled only by stable-release.yml so an unsigned build can
# never become the stable release lane by accident.
# ═══════════════════════════════════════════════════════════════════════════

name: package

on:
  workflow_dispatch:
    inputs:
      publish_rc:
        description: 'Publish/update v1.3.0-rc.2 after the matrix passes'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ['v*-rc.*']
    paths:
      - 'src/**'
      - 'shell/**'
      - '!shell/electron-builder.production.yml'
      - '!shell/build/entitlements.mac.plist'
      - 'build.py'
      - 'package.json'
      - '.github/workflows/package.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            args: --linux
          - os: windows-latest
            name: windows
            args: --win
          - os: macos-latest
            name: macos
            args: --mac

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/setup-node@v4
        with: { node-version: '24' }

      - name: Build the UI
        run: python3 build.py

      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund

      - name: Package unsigned test build
        working-directory: shell
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: breeze-${{ matrix.name }}
          retention-days: 30
          path: |
            shell/dist/*.dmg
            shell/dist/*.zip
            shell/dist/*.exe
            shell/dist/*.AppImage
            shell/dist/*.deb

      - name: Checksums
        working-directory: shell/dist
        run: |
          shasum -a 256 *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null || true

      - name: Report platform package result
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Breeze package **${{ matrix.name }}**: **${{ job.status }}** — run \`${{ github.run_id }}\`, main \`$GITHUB_SHA\`."

  publish-rc:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_rc == true) || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-rc2]')) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Choose prerelease tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "RC_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "RC_TAG=v1.3.0-rc.2" >> "$GITHUB_ENV"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: breeze-*
          path: release-assets
          merge-multiple: true

      - name: Build release manifests
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          files = []
          for p in sorted(root.iterdir()):
              if not p.is_file() or p.name in {'SHA256SUMS.txt', 'release-manifest.json'}:
                  continue
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              files.append({'name': p.name, 'size': p.stat().st_size, 'sha256': h.hexdigest()})
          manifest = {
              'version': '1.3.0',
              'tag': os.environ['RC_TAG'],
              'channel': 'beta',
              'source_sha': '${{ github.sha }}',
              'files': files,
          }
          pathlib.Path('release-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY
          cat SHA256SUMS.txt

      - name: Publish Breeze 1.3.0 RC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RC_TAG"
          notes='Breeze 1.3.0 RC2 is the first daily-driver product pass: Move to Breeze import, persistent preferences and real workspaces, local Reading Queue/Notes/Snapshots, OS-encrypted Breeze Vault, real New Tab activity, factual privacy/runtime surfaces, and real native search/omnibox interactions. Linux, Windows and macOS packages are built directly from canonical KapellaStudio/breeze source. Windows and macOS packages are still test builds and are not production code-signed/notarised; verify SHA256SUMS.txt before testing.'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Breeze 1.3.0 RC 2' --notes "$notes" --prerelease
          fi

      - name: Report prerelease publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Breeze prerelease **$RC_TAG published** — run \`${{ github.run_id }}\`, source \`$GITHUB_SHA\`. Release assets include \`SHA256SUMS.txt\` and \`release-manifest.json\`."

  report:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build, publish-rc]
    runs-on: ubuntu-latest
    steps:
      - name: Report package-test result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "Breeze package test — matrix: **${{ needs.build.result }}**; RC publication: **${{ needs.publish-rc.result }}** — run \`${{ github.run_id }}\`, main \`$GITHUB_SHA\`."
