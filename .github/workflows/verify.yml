name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-manual-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct staged oversized source
        if: ${{ hashFiles('.sourceparts/manifest') != '' }}
        run: |
          while IFS='|' read -r target mode expected parts; do
            [ -n "$target" ] || continue
            mkdir -p "$(dirname "$target")"
            tmp="/tmp/$(basename "$target").payload"
            : > "$tmp"
            IFS=',' read -ra chunk_list <<< "$parts"
            for part in "${chunk_list[@]}"; do cat ".sourceparts/$part" >> "$tmp"; done
            case "${mode:-raw}" in
              gz64) base64 -d "$tmp" | gzip -d > "$target" ;;
              raw) cp "$tmp" "$target" ;;
              *) exit 1 ;;
            esac
            actual="$(sha256sum "$target" | awk '{print $1}')"
            test "$actual" = "$expected"
          done < .sourceparts/manifest
      - name: Build
        run: python3 build.py
      - name: Syntax check shell and source modules
        run: |
          for f in shell/*.js netlify/functions/*.js src/*.js; do
            [ -f "$f" ] && node --check "$f"
          done
      - name: Core product checks
        run: |
          python3 src/sitecheck.py
          python3 src/flowcheck.py
          python3 src/backendcheck.py
          python3 src/privatecheck.py
      - name: Security checks
        run: |
          python3 src/breach.py
          python3 src/breach2.py
          python3 src/breach3.py
          python3 src/mbreach.py
      - name: Install shell dependencies
        working-directory: shell
        run: npm install --no-audit --no-fund
      - name: Package contract
        working-directory: shell
        run: npm run packagecontracttest
      - name: Browser core tests
        working-directory: shell
        run: |
          npm run browsercoretest
          npm run documenttest
          npm run launchtest
          npm run producttest
          npm run contexttest
          npm run vaulttest
          npm run omniboxtest
          npm run splittest
