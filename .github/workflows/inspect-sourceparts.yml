name: inspect-sourceparts

on:
  pull_request:
    branches: [main]
    paths:
      - '.sourceparts/**'
      - '.github/workflows/inspect-sourceparts.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged asset payloads
        shell: bash
        run: |
          set -euo pipefail
          echo '--- assetsbundle ---'
          cat .sourceparts/assetsbundle.*.part > /tmp/assetsbundle.b64
          base64 -d /tmp/assetsbundle.b64 > /tmp/assetsbundle.gz
          gzip -dc /tmp/assetsbundle.gz > /tmp/assetsbundle.raw
          file /tmp/assetsbundle.raw || true
          wc -c /tmp/assetsbundle.raw
          python3 - <<'PY'
          from pathlib import Path
          import tarfile, zipfile
          p=Path('/tmp/assetsbundle.raw')
          b=p.read_bytes()
          print('head repr:', repr(b[:300]))
          if tarfile.is_tarfile(p):
              with tarfile.open(p) as t:
                  print('tar entries:', t.getnames())
          elif zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:
                  print('zip entries:', z.namelist())
          else:
              try:
                  s=b.decode('utf-8')
                  print('utf8 head:', repr(s[:1200]))
              except Exception as e:
                  print('not utf8:', e)
          PY
          echo '--- assetsfix ---'
          base64 -d .sourceparts/assetsfix.00.part > /tmp/assetsfix.gz
          gzip -dc /tmp/assetsfix.gz > /tmp/assetsfix.raw
          file /tmp/assetsfix.raw || true
          wc -c /tmp/assetsfix.raw
          python3 - <<'PY'
          from pathlib import Path
          import tarfile, zipfile
          p=Path('/tmp/assetsfix.raw')
          b=p.read_bytes()
          print('head repr:', repr(b[:300]))
          if tarfile.is_tarfile(p):
              with tarfile.open(p) as t:
                  print('tar entries:', t.getnames())
          elif zipfile.is_zipfile(p):
              with zipfile.ZipFile(p) as z:
                  print('zip entries:', z.namelist())
          else:
              try:
                  print('utf8 head:', repr(b.decode('utf-8')[:1200]))
              except Exception as e:
                  print('not utf8:', e)
          PY
