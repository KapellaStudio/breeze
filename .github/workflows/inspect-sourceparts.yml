name: inspect-sourceparts

on:
  pull_request:
    branches: [main]
    paths:
      - '.sourceparts/**'
      - '.bootstrap/**'
      - '.github/workflows/inspect-sourceparts.yml'
      - 'site/*.b64'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare all historical staged asset chunk variants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, itertools, subprocess

          commits=subprocess.check_output(['git','rev-list','--all'],text=True).splitlines()
          paths=[f'.sourceparts/assetsbundle.{i:02d}.part' for i in range(6)] + ['.sourceparts/assetsfix.00.part']
          variants={p:{} for p in paths}
          for c in commits:
              for p in paths:
                  try:
                      blob=subprocess.check_output(['git','rev-parse',f'{c}:{p}'],stderr=subprocess.DEVNULL,text=True).strip()
                  except subprocess.CalledProcessError:
                      continue
                  if blob in variants[p]: continue
                  b=subprocess.check_output(['git','cat-file','blob',blob])
                  variants[p][blob]=b
          for p in paths:
              print('PATH',p,'VARIANTS',len(variants[p]))
              for blob,b in variants[p].items():
                  compact=b''.join(b.split())
                  print(' VARIANT',blob,'bytes',len(b),'compact',len(compact),'sha256',hashlib.sha256(b).hexdigest(),'head',compact[:40].decode(errors='replace'),'tail',compact[-40:].decode(errors='replace'))

          # Try every historical complete tree state, not only commits that touched part00.
          states={}
          for c in commits:
              sig=[]; chunks=[]; ok=True
              for i in range(6):
                  p=f'.sourceparts/assetsbundle.{i:02d}.part'
                  try:
                      blob=subprocess.check_output(['git','rev-parse',f'{c}:{p}'],stderr=subprocess.DEVNULL,text=True).strip()
                      b=subprocess.check_output(['git','cat-file','blob',blob])
                  except subprocess.CalledProcessError:
                      ok=False; break
                  sig.append(blob); chunks.append(b)
              if not ok: continue
              key=tuple(sig)
              if key in states: continue
              states[key]=c
              compact=b''.join(b''.join(chunks).split())
              try:
                  payload=base64.b64decode(compact + b'='*((-len(compact))%4),validate=True)
                  raw=gzip.decompress(payload)
                  print('STATE_OK',c[:12],'blobs',sig,'b64chars',len(compact),'gzbytes',len(payload),'rawbytes',len(raw),'rawsha',hashlib.sha256(raw).hexdigest())
              except Exception as e:
                  # Stream until first gzip failure to identify corruption offset/output coverage.
                  try:
                      payload=base64.b64decode(compact + b'='*((-len(compact))%4),validate=True)
                      import zlib
                      d=zlib.decompressobj(16+zlib.MAX_WBITS); out=bytearray(); fail=None
                      for n,x in enumerate(payload):
                          try: out.extend(d.decompress(bytes([x])))
                          except Exception as ee: fail=(n,repr(ee)); break
                      print('STATE_BAD',c[:12],'blobs',sig,'b64chars',len(compact),'gzbytes',len(payload),'fail',fail,'out',len(out),'error',repr(e))
                  except Exception as ee:
                      print('STATE_B64_BAD',c[:12],'blobs',sig,'b64chars',len(compact),repr(ee))
          print('UNIQUE_COMPLETE_STATES',len(states))

          # If a part has multiple historical variants, brute-force the small Cartesian product.
          bundle_sets=[]
          for i in range(6):
              p=f'.sourceparts/assetsbundle.{i:02d}.part'
              vals=list(variants[p].items())
              if not vals:
                  bundle_sets=[]; break
              bundle_sets.append(vals)
          combos=1
          for vals in bundle_sets: combos*=len(vals)
          print('COMBINATIONS',combos)
          if bundle_sets and combos <= 10000:
              for combo in itertools.product(*bundle_sets):
                  blobs=[x[0] for x in combo]; compact=b''.join(b''.join(x[1] for x in combo).split())
                  try:
                      payload=base64.b64decode(compact + b'='*((-len(compact))%4),validate=True)
                      raw=gzip.decompress(payload)
                  except Exception:
                      continue
                  print('COMBO_OK','blobs',blobs,'b64chars',len(compact),'gzbytes',len(payload),'rawbytes',len(raw),'rawsha',hashlib.sha256(raw).hexdigest())
          PY
