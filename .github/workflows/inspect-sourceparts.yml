name: inspect-sourceparts

on:
  pull_request:
    branches: [main]
    paths:
      - '.sourceparts/**'
      - '.github/workflows/inspect-sourceparts.yml'
      - 'site/*.b64'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover canonical branding from repository payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, struct, zlib

          for name in ['site/kapella-word-dark.png.b64','site/kapella-word-light.png.b64']:
              s=Path(name).read_text().strip()
              raw=base64.b64decode(s)
              print('TRACKED', name, 'text_bytes=', len(s), 'text_sha256=', hashlib.sha256(s.encode()).hexdigest(), 'png_bytes=',len(raw),'png_sha256=',hashlib.sha256(raw).hexdigest())

          p=Path('.bootstrap/part00.b64')
          if not p.exists():
              print('NO_BOOTSTRAP')
              raise SystemExit(0)
          compact=''.join(p.read_text().split())
          usable=len(compact)-(len(compact)%4)
          raw=base64.b64decode(compact[:usable], validate=True)
          print('BOOTSTRAP_CHARS',len(compact),'USABLE',usable,'BOOTSTRAP_BYTES', len(raw), hashlib.sha256(raw).hexdigest())
          off=0
          while off+30 <= len(raw) and raw[off:off+4] == b'PK\x03\x04':
              sig,ver,flags,method,mtime,mdate,crc,csize,usize,nlen,xlen=struct.unpack_from('<IHHHHHIIIHH', raw, off)
              name=raw[off+30:off+30+nlen].decode('utf-8','replace')
              data_start=off+30+nlen+xlen
              avail=max(0,min(csize,len(raw)-data_start))
              chunk=raw[data_start:data_start+avail]
              print('ZIP_ENTRY', name, 'method=',method,'csize=',csize,'usize=',usize,'available=',avail)
              out=b''
              if method==0:
                  out=chunk
              elif method==8:
                  d=zlib.decompressobj(-15)
                  try:
                      out=d.decompress(chunk)
                  except Exception as e:
                      print('INFLATE_ERROR', name, repr(e))
              if out:
                  print('RECOVERED_PREFIX', name, 'bytes=',len(out),'sha256=',hashlib.sha256(out).hexdigest())
                  if name.endswith('.html'):
                      text=out.decode('utf-8','ignore')
                      print('HTML_HEAD', repr(text[:500]))
                      print('HTML_TAIL', repr(text[-500:]))
                      for i,m in enumerate(re.finditer(r'iVBORw0KGgo[0-9A-Za-z+/=]{80,}', text)):
                          s=m.group(0)
                          try: png=base64.b64decode(s + '===')
                          except Exception: continue
                          print('PNG_CANDIDATE', i, 'text_len=',len(s),'text_sha256=',hashlib.sha256(s.encode()).hexdigest(),'png_len=',len(png),'png_sha256=',hashlib.sha256(png).hexdigest(),'pos=',m.start())
              if avail < csize:
                  break
              off=data_start+csize
              if flags & 0x08:
                  print('DATA_DESCRIPTOR_FLAG', name)
                  break
          PY
